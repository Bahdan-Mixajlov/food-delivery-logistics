services:
  db:
    image: mysql:8.0
    container_name: food_delivery_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-food_delivery}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: food_delivery_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    environment:
      DB_HOST: db

  admin:
    build: ./admin-panel
    container_name: food_delivery_admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

  client-web:
    build: ./mobile-client
    container_name: food_delivery_client_web
    restart: always
    ports:
      - "8086:80"
    depends_on:
      - backend

  courier-web:
    build: ./mobile-courier
    container_name: food_delivery_courier_web
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - backend

volumes:
  db_data:
